<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Komuta Merkezi — Ana Giriş</title>
<style>
:root{--bg:#0f1419;--panel:#1a2230;--line:#2d3a4d;--txt:#e6edf3;--mut:#8b9bb0;--shadow:0 8px 26px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#eef2f7;--panel:#fff;--line:#dde5ef;--txt:#15202b;--mut:#5d6b7d;--shadow:0 8px 24px rgba(60,90,130,.15)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:8px}
h1{margin:0;font-size:26px}
.dt{color:var(--mut);font-size:14px;margin-bottom:18px}
.hubs{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:760px;width:100%}
.hub{text-decoration:none;color:#fff;border-radius:22px;padding:34px 24px;text-align:center;box-shadow:var(--shadow);transition:.18s;border:none}
.hub:hover{transform:translateY(-5px) scale(1.02)}
.hub.is{background:linear-gradient(135deg,#ff9800,#e65100)}
.hub.ki{background:linear-gradient(135deg,#9c27b0,#e91e63)}
.hub .em{font-size:60px;display:block;margin-bottom:10px}
.hub .t{font-size:22px;font-weight:800}
.hub .d{font-size:13px;opacity:.92;margin-top:8px;line-height:1.5}
.tg{position:fixed;top:16px;right:16px;background:var(--panel);border:1px solid var(--line);color:var(--txt);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px}
.foot{color:var(--mut);font-size:12px;margin-top:20px;text-align:center}
</style>
</head>
<body data-theme="dark">
<button class="tg" id="themeBtn">🌙</button>
<h1>🎯 Komuta Merkezi</h1>
<div class="dt" id="dt"></div>
<div class="hubs">
  <a class="hub is" href="KOMUTA-IS.html"><span class="em">🧾</span><span class="t">İŞ</span><div class="d">Müşavir Pro · e-Beyanname · Fatura · Banka · Trendyol + beyanname son günleri</div></a>
  <a class="hub ki" href="KOMUTA-KISISEL.html"><span class="em">🎯</span><span class="t">KİŞİSEL</span><div class="d">KGK Sınav · Soru-Cevap · Spor & Sağlık · Kişisel Gelişim + sınav sayacı</div></a>
</div>
<div class="foot">İki çatı, tek merkez. Her panel kendi penceresinde tam çalışır — veriler asla karışmaz.</div>
<script>
const $=id=>document.getElementById(id);
function theme(t){document.body.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem("komuta_theme",t)}catch(e){}}
$("themeBtn").onclick=()=>theme(document.body.dataset.theme==="dark"?"light":"dark");
try{theme(localStorage.getItem("komuta_theme")||"dark")}catch(e){theme("dark")}
const A=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],G=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const d=new Date();$("dt").textContent=d.getDate()+" "+A[d.getMonth()]+" "+d.getFullYear()+" "+G[d.getDay()];
</script>
</body>
</html>
