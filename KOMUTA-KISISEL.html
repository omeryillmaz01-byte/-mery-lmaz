<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Kişisel Komuta Merkezi</title>
<style>
:root{--bg:#0f1419;--panel:#1a2230;--panel2:#222d3d;--line:#2d3a4d;--txt:#e6edf3;--mut:#8b9bb0;--acc:#4cc2ff;--acc2:#22d3a0;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c}
[data-theme="light"]{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--line:#dde5ef;--txt:#15202b;--mut:#5d6b7d;--acc:#1273e6;--acc2:#0aa97a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{background:transparent;border:1px solid var(--line);color:var(--mut);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--txt);border-color:var(--acc)}
.tab.active{background:var(--acc);color:#06121c;border-color:var(--acc)}
.tab .x{font-size:10px;opacity:.7;margin-left:3px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#wrap{flex:1;position:relative;overflow:auto}
#frame{width:100%;height:100%;border:none;display:none;background:#fff}
#info{padding:18px;max-width:820px;margin:0 auto}
.hero{background:linear-gradient(135deg,#9c27b0,#e91e63);border-radius:16px;padding:22px;color:#fff;text-align:center;margin-bottom:16px}
.hero .big{font-size:50px;font-weight:800;line-height:1;margin:4px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px}
.rem{display:flex;gap:10px;align-items:flex-start;padding:7px 0}.rem .ic{font-size:19px}
.notice{font-size:12px;color:var(--mut);background:var(--panel2);border:1px dashed var(--line);padding:8px 11px;border-radius:9px;margin-top:8px}
</style>
</head>
<body data-theme="dark">
<header>
  <h1>🎯 Kişisel Merkez</h1>
  <div class="tabs" id="tabs"></div>
  <a class="iconbtn" href="KOMUTA-MERKEZI.html" title="Ana Giriş">🏠</a>
  <button class="iconbtn" id="themeBtn">🌙</button>
</header>
<div id="wrap">
  <iframe id="frame" allow="clipboard-write; clipboard-read; fullscreen"></iframe>
  <div id="info">
    <div class="hero"><div style="opacity:.9;font-size:13px">KGK SINAVINA</div><div class="big" id="kalanGun">–</div><div style="opacity:.9;font-size:13px">GÜN KALDI · 21 Kasım 2026</div></div>
    <div class="card"><h2>📌 Bugünün Hatırlatmaları</h2><div id="remList"></div></div>
    <div class="card"><h2>ℹ️ Kullanım</h2><div class="notice">🟢 KGK, Soru ve Spor panelleri <b>bu pencerede</b> açılır. 🟡 Kişisel Gelişim, bu ayın <b>Excel</b> dosyasını açar (Excel'de). KGK ve Soru verileri ayrıştırıldı — <b>asla karışmaz</b>.</div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function theme(t){document.body.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem("komuta_theme",t)}catch(e){}}
$("themeBtn").onclick=()=>theme(document.body.dataset.theme==="dark"?"light":"dark");
try{theme(localStorage.getItem("komuta_theme")||"dark")}catch(e){theme("dark")}
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const d0=new Date();
const kgRel=encodeURI("../🟡 KISISEL_GELISIM/"+d0.getFullYear()+"/KISISEL_GELISIM_"+d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+".xlsx");
const TABS=[
 {ad:"🏠 Özet",type:"info"},
 {ad:"🎓 KGK Sınav",type:"panel",src:"KGK-Sinav-Paneli.html"},
 {ad:"📚 Soru-Cevap",type:"panel",src:"Soru-Paneli.html"},
 {ad:"💪 Spor & Sağlık",type:"panel",src:"SAGLIK-SPOR-DIYET-PANEL_v3.html"},
 {ad:"🟡 Kişisel Gelişim",type:"ext",href:kgRel},
];
let aktif=0;
function render(){$("tabs").innerHTML=TABS.map((t,i)=>`<button class="tab ${i===aktif?'active':''}" data-i="${i}">${t.ad}${t.type==='ext'?'<span class="x">↗</span>':''}</button>`).join("");document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>sec(+b.dataset.i));}
function sec(i){const t=TABS[i];if(t.type==="ext"){window.open(t.href,"_blank");return;}aktif=i;render();if(t.type==="info"){$("frame").style.display="none";$("frame").src="about:blank";$("info").style.display="block";}else{$("info").style.display="none";$("frame").style.display="block";if($("frame").src.indexOf(t.src)<0)$("frame").src=t.src;}}
render();
/* sınav */
const SINAV=new Date(2026,10,21);(function(){const t=new Date();t.setHours(0,0,0,0);$("kalanGun").textContent=Math.ceil((SINAV-t)/86400000);})();
/* hatırlatmalar */
const dow=new Date().getDay();
const split=["Dinlenme/serbest","1. Gün: Göğüs+Arka Kol","2. Gün: Omuz+Bacak+Karın","3. Gün: Sırt+Ön Kol","1. Gün: Göğüs+Arka Kol","2. Gün: Omuz+Bacak+Karın","Dinlenme"][dow];
const rem=[{ic:"🎓",t:"<b>KGK:</b> sekmeden aç → Çalışma Takvimim → Koç → 1-2-3 → Günü Bitir"},{ic:"💪",t:"<b>Bugün spor:</b> "+split+" (videolu anlatımla)"},{ic:"🟡",t:"<b>Kişisel gelişim:</b> bu ayın Excel'ini aç, hedeflerini işaretle"},{ic:"💧",t:"<b>Sağlık:</b> ~3.5 L su · ~2200 kcal"}];
$("remList").innerHTML=rem.map(r=>`<div class="rem"><span class="ic">${r.ic}</span><span>${r.t}</span></div>`).join("");
</script>
</body>
</html>
